<article class="run-detail">
	<header class="detail-head">
		<button class="btn btn-link" type="button" onclick="kuuBackToRuns()">← runs</button>
		<div id="run-summary"><span class="placeholder">loading run…</span></div>
	</header>
	<nav class="detail-tabs" id="detail-tabs" aria-label="Run detail sections" hidden>
		<button type="button" data-detail-tab="attempts">attempts <span id="attempt-count">0</span></button>
		<button type="button" data-detail-tab="logs">logs</button>
		<button type="button" data-detail-tab="failure">failure</button>
	</nav>
	<section class="detail-panel" id="detail-attempts" data-detail-panel="attempts" hidden></section>
	<section class="detail-panel log-panel" id="detail-logs" data-detail-panel="logs" hidden>
		<div class="log-toolbar">
			<label><span>Attempt</span><select id="log-attempt-select"></select></label>
			<label><span>Level</span><select id="log-level-filter">
				<option value="0">All</option><option value="10">Debug+</option><option value="20" selected>Info+</option><option value="30">Warning+</option><option value="40">Error+</option>
			</select></label>
			<label class="filter-grow"><span>Search</span><input id="log-search" placeholder="Message or field"></label>
			<span class="log-state" id="log-poll-indicator"></span>
		</div>
		<div class="log-stream" id="log-stream-body"><p class="placeholder">loading logs…</p></div>
	</section>
	<section class="detail-panel" id="detail-failure" data-detail-panel="failure" hidden></section>
</article>

<script>
(function(){
	window.kuuRunDetailAbort?.abort();
	const controller=new AbortController();
	window.kuuRunDetailAbort=controller;
	const mid={{ message_id|tojson|safe }};
	const requestedTab={{ tab|tojson|safe }};
	const traceUrlTemplate={{ trace_url_template|tojson|safe }};
	let attempts=[],run=null,activeTab='',logAfter=0,logTimer,searchTimer;
	const terminalStates=['succeeded','failed','cancelled'];

	fetchRun();

	function fetchRun(){
		fetch('api/task-run-attempts?message_id='+encodeURIComponent(mid)).then(response=>response.json()).then(data=>{
			if(!data.attempts) return;
			attempts=data.attempts;
			run=data.run;
			render();
		}).catch(()=>document.getElementById('run-summary').innerHTML='<span class="placeholder is-warn">run unavailable.</span>');
	}
	function render(){
		if(!attempts.length){document.getElementById('run-summary').innerHTML='<span class="placeholder">no attempts found.</span>';return;}
		const latest=attempts[attempts.length-1];
		const status=run?.status||latest.status;
		const active=['enqueued','running'].includes(status);
		const terminal=terminalStates.includes(status);
		document.getElementById('run-summary').innerHTML=`
			<div class="detail-title"><span class="status-text ${statusClass(status)}">${esc(status)}</span><h1>${esc(latest.task)}</h1></div>
			<div class="detail-facts">
				<span><b>Run</b><code>${esc(mid)}</code></span><span><b>Queue</b><code>${esc(latest.queue||'—')}</code></span>
				<span><b>Attempts</b><code>${attempts.length}</code></span><span><b>Duration</b><code>${formatDuration(latest.time_elapsed)}</code></span>
			</div>
			<div class="run-actions">
				${active?'<button class="btn btn-danger" id="run-cancel">cancel</button>':''}
				${status==='unknown'?'<button class="btn btn-primary" id="run-retry">retry</button>':''}
				${terminal?'<button class="btn btn-primary" id="run-replay">replay</button>':''}
			</div>`;
		document.getElementById('attempt-count').textContent=String(attempts.length);
		document.getElementById('detail-tabs').hidden=false;
		renderAttempts();
		renderFailure();
		setupLogAttempts();
		bindActions();
		const contextual=status==='failed'?'failure':attempts.length>1?'attempts':'logs';
		selectTab(requestedTab||new URL(location.href).searchParams.get('run_tab')||contextual,false);
	}
	function renderAttempts(){
		const panel=document.getElementById('detail-attempts');
		let html='<table class="kuu-table attempts-table"><thead><tr><th>#</th><th>Status</th><th>Started</th><th>Finished</th><th>Duration</th><th>Exception</th><th></th></tr></thead><tbody>';
		for(const attempt of attempts){
			const number=attempt.attempt+1;
			html+=`<tr class="attempt-row" data-attempt="${attempt.attempt}" tabindex="0">
				<td class="mono-cell">${number}</td><td><span class="status-text ${statusClass(attempt.status)}">${esc(attempt.status==='dead'?'failed':attempt.status)}</span></td>
				<td class="mono-cell dim">${formatTime(attempt.started_at)}</td><td class="mono-cell dim">${formatTime(attempt.finished_at)}</td>
				<td class="mono-cell">${formatDuration(attempt.time_elapsed)}</td><td class="mono-cell">${esc(attempt.exc_type||'—')}</td>
				<td><button class="btn btn-link view-attempt-logs" type="button">View logs</button></td></tr>`;
			const inputs=attempt.args||attempt.kwargs?`<div class="captured-grid">${attempt.args?captured('args',attempt.args):''}${attempt.kwargs?captured('kwargs',attempt.kwargs):''}${attempt.result_preview!==null&&attempt.result_preview!==undefined?captured('result preview',attempt.result_preview):''}</div>`:'';
			html+=`<tr class="attempt-extra" hidden><td colspan="7">${inputs||'<span class="dim">no captured input or result.</span>'}</td></tr>`;
		}
		html+='</tbody></table>';
		panel.innerHTML=html;
		panel.querySelectorAll('.attempt-row').forEach(row=>{
			const toggle=event=>{
				if(event.target.closest('.view-attempt-logs')) return;
				const extra=row.nextElementSibling;
				extra.hidden=!extra.hidden;
			};
			row.addEventListener('click',toggle);
			row.addEventListener('keydown',event=>{if(event.key==='Enter'){toggle(event);}});
		});
		panel.querySelectorAll('.view-attempt-logs').forEach(button=>button.addEventListener('click',event=>{
			event.stopPropagation();
			document.getElementById('log-attempt-select').value=button.closest('.attempt-row').dataset.attempt;
			resetLogs();
			selectTab('logs',true);
		}));
	}
	function renderFailure(){
		const panel=document.getElementById('detail-failure');
		const failed=[...attempts].reverse().find(attempt=>attempt.failure||attempt.traceback||attempt.exc_message);
		if(!failed){panel.innerHTML='<p class="placeholder">no failure recorded for this run.</p>';return;}
		if(failed.failure){panel.innerHTML=renderRemoteFailure(failed.failure);return;}
		panel.innerHTML=`<div class="failure-title"><strong>${esc(failed.exc_type||'Error')}</strong><span>${esc(failed.exc_message||'')}</span></div><pre class="terminal-block">${esc(failed.traceback||'')}</pre>`;
	}
	function renderRemoteFailure(failure){
		let html='<div class="remote-failure"><div class="failure-title"><strong>'+esc(failure.type_module+'.'+failure.type_name)+'</strong><span>'+esc(failure.message)+'</span></div>';
		for(const frame of failure.frames||[]){
			const kind=frame.application===false?'library':'application';
			html+='<details class="failure-frame '+kind+'" '+(kind==='application'?'open':'')+'><summary><em>'+kind+'</em><b>'+esc(frame.function)+'</b><span>'+esc(frame.filename)+':'+frame.lineno+'</span></summary>';
			if(frame.source?.length) html+='<pre>'+frame.source.map((line,index)=>{const number=frame.source_start_line+index;return '<i class="'+(number===frame.lineno?'active':'')+'"><b>'+number+'</b>'+esc(line)+'</i>';}).join('')+'</pre>';
			html+='</details>';
		}
		if(failure.cause) html+='<div class="failure-chain"><span>Caused by</span>'+renderRemoteFailure(failure.cause)+'</div>';
		else if(failure.context) html+='<div class="failure-chain"><span>During handling</span>'+renderRemoteFailure(failure.context)+'</div>';
		html+='<details class="raw-trace"><summary>Raw traceback</summary><pre class="terminal-block">'+esc(failure.traceback||'')+'</pre></details></div>';
		return html;
	}
	function setupLogAttempts(){
		const select=document.getElementById('log-attempt-select');
		const previous=select.value;
		select.innerHTML=attempts.map(attempt=>`<option value="${attempt.attempt}">#${attempt.attempt+1} · ${esc(attempt.status)}</option>`).join('');
		select.value=previous||String(attempts[attempts.length-1].attempt);
	}
	function selectTab(name,push){
		if(!['attempts','logs','failure'].includes(name)) name='attempts';
		activeTab=name;
		document.querySelectorAll('[data-detail-tab]').forEach(button=>{
			const active=button.dataset.detailTab===name;
			button.classList.toggle('active',active);
			button.setAttribute('aria-selected',String(active));
		});
		document.querySelectorAll('[data-detail-panel]').forEach(panel=>panel.hidden=panel.dataset.detailPanel!==name);
		const url=new URL(location.href);
		url.searchParams.set('run_tab',name);
		history[push?'pushState':'replaceState']({},'',url);
		if(name==='logs') scheduleLoad(0); else clearLogTimer();
	}
	function bindActions(){
		document.querySelectorAll('[data-detail-tab]').forEach(button=>button.addEventListener('click',()=>selectTab(button.dataset.detailTab,true)));
		document.getElementById('run-cancel')?.addEventListener('click',function(){runAction(this,'api/cancel-run','Cancel requested');});
		document.getElementById('run-retry')?.addEventListener('click',function(){runAction(this,'api/retry-run','Attempt enqueued');});
		document.getElementById('run-replay')?.addEventListener('click',async function(){
			this.disabled=true;
			const result=await runCommand('api/replay-run');
			if(result.ok&&result.run_id){window.kuuToast?.('Replayed as new Run',true);window.kuuOpenRun(result.run_id,true,'attempts');}
			else{this.disabled=false;window.kuuToast?.(result.error||'Replay failed',false);}
		});
	}
	async function runAction(button,url,message){
		button.disabled=true;
		const result=await runCommand(url);
		if(result.ok){window.kuuToast?.(message,true);fetchRun();}
		else{button.disabled=false;window.kuuToast?.(result.error||'Request failed',false);}
	}
	async function runCommand(url){
		try{
			const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:mid})});
			const body=await response.json().catch(()=>({}));
			return {ok:response.ok,...body};
		}catch(_){return {ok:false,error:'Request failed'};}
	}
	function resetLogs(){logAfter=0;document.getElementById('log-stream-body').innerHTML='<p class="placeholder">loading logs…</p>';scheduleLoad(0);}
	function clearLogTimer(){if(logTimer){clearTimeout(logTimer);logTimer=null;}}
	function scheduleLoad(delay){clearLogTimer();logTimer=setTimeout(loadLogs,delay);}
	function loadLogs(){
		if(activeTab!=='logs') return;
		const attempt=parseInt(document.getElementById('log-attempt-select').value||'0',10);
		const level=parseInt(document.getElementById('log-level-filter').value||'0',10);
		const term=(document.getElementById('log-search').value||'').trim().toLowerCase();
		setLogState('fetching');
		fetch(`api/task-run-logs?message_id=${encodeURIComponent(mid)}&attempt=${attempt}&limit=500&after_id=${logAfter}`).then(response=>response.json()).then(data=>{
			const body=document.getElementById('log-stream-body');
			let html='';
			for(const log of data.logs||[]){
				if(log.kind==='progress'){
					const pct=log.total?Math.max(0,Math.min(100,log.current/log.total*100)):0;
					html+=`<div class="progress-line"><span>PROGRESS</span><div><i style="width:${pct}%"></i></div><strong>${log.current??'—'}${log.total?' / '+log.total:''}</strong><em>${esc(log.message||'')}</em></div>`;
					continue;
				}
				if(log.kind==='gap'){html+=`<div class="gap-line">OBSERVATION GAP · ${esc(log.dropped||0)} records missing</div>`;continue;}
				if(log.level<level) continue;
				const message=log.message||'';
				const fields=log.fields&&Object.keys(log.fields).length?' '+JSON.stringify(log.fields):'';
				if(term&&!(message+fields).toLowerCase().includes(term)) continue;
				const traceUrl=traceUrlTemplate&&log.fields?.trace_id?traceUrlTemplate.replace('{trace_id}',encodeURIComponent(log.fields.trace_id)).replace('{span_id}',encodeURIComponent(log.fields.span_id||'')):'';
				const trace=traceUrl?` <a class="trace-link" href="${esc(traceUrl)}" target="_blank" rel="noopener">trace ↗</a>`:'';
				html+=`<div class="log-line level-${log.level}"><span>${formatTime(log.ts)}</span><b>${levelLabel(log.level)}</b><code>${esc(log.kind==='stdout'||log.kind==='stderr'?log.kind:(log.logger||''))}</code><p>${esc(message)}<small>${esc(fields)}</small>${trace}</p></div>`;
			}
			if(logAfter===0) body.innerHTML=html||'<p class="placeholder">no logs for this attempt.</p>'; else if(html) body.innerHTML+=html;
			if(data.cursor) logAfter=data.cursor;
			setLogState('live');
			scheduleLoad(15000);
		}).catch(()=>{setLogState('error');scheduleLoad(5000);});
	}
	function setLogState(value){document.getElementById('log-poll-indicator').textContent=value;}
	function captured(label,value){return `<div><span class="detail-label">${label}</span><pre>${esc(pretty(value))}</pre></div>`;}
	function formatDuration(value){return value!=null?Number(value).toFixed(2)+'s':'—';}
	function formatTime(value){return value?new Date(value).toISOString().replace('T',' ').slice(5,19):'—';}
	function statusClass(value){return value==='succeeded'?'is-good':value==='failed'||value==='dead'?'is-warn':'';}
	function levelLabel(value){return ({10:'DBG',20:'INF',30:'WRN',40:'ERR',50:'CRT'})[value]||String(value);}
	function pretty(value){try{return JSON.stringify(value,null,2);}catch{return String(value);}}
	function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

	document.getElementById('log-attempt-select').addEventListener('change',resetLogs);
	document.getElementById('log-level-filter').addEventListener('change',resetLogs);
	document.getElementById('log-search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(resetLogs,250);});
	window.addEventListener('kuu-envelope',event=>{
		const payload=event.detail.envelope?.body||{};
		if(payload.type==='log_batch'&&payload.records?.some(record=>record.message_id===mid)) scheduleLoad(0);
		if(payload.type==='event'&&payload.message_id===mid) fetchRun();
	},{signal:controller.signal});
	window.addEventListener('kuu-stream-gap',()=>scheduleLoad(0),{signal:controller.signal});
})();
</script>
