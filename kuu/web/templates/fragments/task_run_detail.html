<div class="surface-head" style="border-bottom:1px solid var(--hair);margin:-1px">
	<span class="surface-title">RUN</span>
	<span class="mono dim" style="margin-left:var(--s-2)" id="detail-mid">{{ message_id }}</span>
	<button class="btn" style="margin-left:auto" onclick="kuuOpenRun('')" aria-label="Close Run detail">close</button>
</div>
<div class="surface-body flush" id="attempts-area">
	<p class="placeholder">loading attempts…</p>
</div>

<div id="log-stream-surface" style="border-top:1px solid var(--hair);display:none">
	<div class="surface-head" style="margin:0">
		<span class="surface-title">logs</span>
		<span class="mono dim" style="margin-left:var(--s-2)" id="log-attempt-tag" data-mid="" data-attempt=""></span>
		<div style="margin-left:auto;display:flex;gap:var(--s-2);align-items:center">
			<span class="dim" id="log-poll-indicator" style="font-size:11px"></span>
			<select id="log-level-filter" class="filter-select">
				<option value="0">all levels</option>
				<option value="10">≥ DEBUG</option>
				<option value="20" selected>≥ INFO</option>
				<option value="30">≥ WARNING</option>
				<option value="40">≥ ERROR</option>
			</select>
			<input id="log-search" class="filter-input" placeholder="search…" style="width:120px">
			<button class="btn btn-tiny" id="log-close-btn">close</button>
		</div>
	</div>
	<div class="surface-body flush" style="max-height:400px;overflow-y:auto" id="log-stream-body">
		<p class="placeholder">select an attempt to view logs</p>
	</div>
</div>

<script>
(function(){
	window.kuuRunDetailAbort?.abort();
	const controller=new AbortController();
	window.kuuRunDetailAbort=controller;
	const mid = '{{ message_id }}';
	const traceUrlTemplate = {{ trace_url_template|tojson }};
	if(!mid){ document.getElementById('attempts-area').innerHTML='<p class="placeholder">no message_id</p>'; return; }

	fetch('api/task-run-attempts?message_id='+encodeURIComponent(mid))
		.then(r=>r.json()).then(d=>{
			if(!d.attempts){ return; }
			renderAttempts(d.attempts,d.run);
		}).catch(()=>{});

	function renderAttempts(attempts,run){
		const area = document.getElementById('attempts-area');
		if(!attempts||!attempts.length){ area.innerHTML='<p class="placeholder">no attempts found</p>'; return; }
		const task=attempts[0].task||'?', queue=attempts[0].queue||'?';
		const latest=attempts[attempts.length-1];
		const runStatus=run?.status||latest.status;
		const active=['enqueued','running'].includes(runStatus);
		const terminal=['succeeded','failed','cancelled'].includes(runStatus);
		let h = '<div class="detail-meta">'
			+'<span>task: <strong>'+esc(task)+'</strong></span>'
			+'<span class="dim">queue: '+esc(queue)+'</span>'
			+'<span><span class="status-badge '+sbc(runStatus)+'">'+esc(runStatus)+'</span></span>'
			+'<span class="dim">attempts: '+attempts.length+'</span>'
			+(run?.replay_of?'<button class="run-link" onclick="kuuOpenRun(\''+esc(run.replay_of)+'\')">replay of '+esc(run.replay_of.slice(0,10))+'…</button>':'')
			+'<span class="run-actions">'
			+(active?'<button class="btn btn-danger btn-tiny" id="run-cancel">cancel</button>':'')
			+(runStatus==='unknown'?'<button class="btn btn-primary btn-tiny" id="run-retry">retry</button>':'')
			+(terminal?'<button class="btn btn-primary btn-tiny" id="run-replay">replay</button>':'')
			+'</span></div>';
		h += '<div class="detail-rail">'+attempts.map((a,i)=>'<i class="rail-node '+railClass(a.status)+'"><b>'+(i+1)+'</b><small>'+esc(a.status==='dead'?'failed · DLQ':a.status)+'</small></i>').join('<span></span>')+'</div>';
		h += '<table class="kuu-table"><thead><tr>'
			+'<th>#</th><th>status</th><th>started</th><th>finished</th>'
			+'<th>elapsed</th><th class="exc-col">exc</th><th></th></tr></thead><tbody>';
		for(const a of attempts){
			const started = a.started_at ? ts(a.started_at) : '-';
			const finished = a.finished_at ? ts(a.finished_at) : '-';
			const elapsed = a.time_elapsed!=null ? a.time_elapsed.toFixed(2)+'s' : '-';
			const sc = sbc(a.status);
			const exc = a.exc_type||'';
			h += '<tr class="attempt-row" data-attempt="'+a.attempt+'" title="click to expand">'
				+'<td>'+(a.attempt+1)+'</td>'
				+'<td><span class="status-badge '+sc+'">'+esc(a.status)+'</span></td>'
				+'<td class="dim">'+started+'</td>'
				+'<td class="dim">'+finished+'</td>'
				+'<td>'+elapsed+'</td>'
				+'<td class="mono-cell exc-cell" title="'+esc(exc)+'">'+esc(exc)+'</td>'
				+'<td class="action-cell"><button class="btn btn-primary btn-tiny view-logs-btn">logs</button></td></tr>';
			const args = a.args ? '<div class="detail-section"><div class="detail-label">args</div><pre class="detail-pre">'+esc(pretty(a.args))+'</pre></div>' : '';
			const kwargs = a.kwargs ? '<div class="detail-section"><div class="detail-label">kwargs</div><pre class="detail-pre">'+esc(pretty(a.kwargs))+'</pre></div>' : '';
			const result = a.result_preview !== null && a.result_preview !== undefined ? '<div class="detail-section"><div class="detail-label">result preview</div><pre class="detail-pre">'+esc(pretty(a.result_preview))+'</pre></div>' : '';
			const trace = a.failure ? renderFailure(a.failure) : (a.traceback ? '<div class="detail-section"><div class="detail-label">traceback</div><pre class="detail-pre traceback">'+esc(a.traceback)+'</pre></div>' : '');
			const excMsg = a.exc_message&&!a.traceback ? '<div class="detail-section"><div class="detail-label">error</div><pre class="detail-pre">'+esc(a.exc_message)+'</pre></div>' : '';
			const empty = !args && !kwargs && !result && !trace && !excMsg
				? '<div class="detail-section dim">no captured inputs/result/traceback</div>' : '';
			h += '<tr class="attempt-extra" style="display:none"><td colspan="7"><div class="detail-extra-body">'+args+kwargs+result+trace+excMsg+empty+'</div></td></tr>';
		}
		h += '</tbody></table>';
		area.innerHTML = h;

		area.querySelectorAll('.attempt-row').forEach(tr=>{
			tr.style.cursor='pointer';
			tr.addEventListener('click',function(e){
				if(e.target.closest('.view-logs-btn')) return;
				const extra=tr.nextElementSibling;
				if(extra&&extra.classList.contains('attempt-extra')){
					extra.style.display = extra.style.display==='none' ? '' : 'none';
				}
			});
		});
		document.getElementById('run-cancel')?.addEventListener('click',async function(){
			this.disabled=true; this.textContent='requesting…';
			const result=await runCommand('api/cancel-run');
			if(result.ok){ this.textContent='cancel requested'; window.kuuToast?.('cancel requested',true); }
			else { this.disabled=false; this.textContent='cancel'; window.kuuToast?.(result.error||'cancel failed',false); }
		});
		document.getElementById('run-retry')?.addEventListener('click',async function(){
			this.disabled=true; this.textContent='retrying…';
			const result=await runCommand('api/retry-run');
			if(result.ok){ this.textContent='retry enqueued'; window.kuuToast?.('new Attempt enqueued',true); }
			else { this.disabled=false; this.textContent='retry'; window.kuuToast?.(result.error||'retry failed',false); }
		});
		document.getElementById('run-replay')?.addEventListener('click',async function(){
			this.disabled=true; this.textContent='replaying…';
			const result=await runCommand('api/replay-run');
			if(result.ok&&result.run_id){ window.kuuToast?.('replayed as new Run',true); window.kuuOpenRun(result.run_id); }
			else { this.disabled=false; this.textContent='replay'; window.kuuToast?.(result.error||'replay failed',false); }
		});
		area.querySelectorAll('.view-logs-btn').forEach(btn=>{
			btn.addEventListener('click',function(e){
				e.stopPropagation();
				const tr=this.closest('.attempt-row');
				const attempt=parseInt(tr.dataset.attempt||'0',10);
				const tag=document.getElementById('log-attempt-tag');
				tag.dataset.mid=mid;
				tag.dataset.attempt=String(attempt);
				tag.textContent='attempt #'+(attempt+1);
				const surface=document.getElementById('log-stream-surface');
				surface.style.display='';
				_logAfter=0;
				document.getElementById('log-stream-body').innerHTML='<p class="placeholder">loading…</p>';
				scheduleLoad(0);
			});
		});
	}

	function renderFailure(failure){
		let h='<div class="detail-section remote-failure"><div class="detail-label">remote failure</div>'
			+'<div class="failure-title"><strong>'+esc(failure.type_module+'.'+failure.type_name)+'</strong><span>'+esc(failure.message)+'</span></div>';
		for(const frame of failure.frames||[]){
			const kind=frame.application===false?'library':'application';
			h+='<details class="failure-frame '+kind+'" '+(kind==='application'?'open':'')+'><summary><em>'+kind+'</em>'+esc(frame.function)+' <span>'+esc(frame.filename)+':'+frame.lineno+'</span></summary>';
			if(frame.source&&frame.source.length){
				h+='<pre>'+frame.source.map((line,index)=>{const n=frame.source_start_line+index;return '<i class="'+(n===frame.lineno?'active':'')+'"><b>'+n+'</b>'+esc(line)+'</i>';}).join('')+'</pre>';
			}
			h+='</details>';
		}
		if(failure.cause) h+='<div class="failure-chain"><span>caused by</span>'+renderFailure(failure.cause)+'</div>';
		else if(failure.context) h+='<div class="failure-chain"><span>during handling</span>'+renderFailure(failure.context)+'</div>';
		h+='<details class="raw-trace"><summary>raw traceback</summary><pre class="detail-pre traceback">'+esc(failure.traceback||'')+'</pre></details></div>';
		return h;
	}

	async function runCommand(url){
		try{
			const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:mid})});
			const body=await response.json().catch(()=>({}));
			return {ok:response.ok,...body};
		}catch(_){ return {ok:false,error:'request failed'}; }
	}

	let _logAfter=0, _logTimer, _searchTimer;

	function clearTimer(){ if(_logTimer){ clearTimeout(_logTimer); _logTimer=null; } }

	function scheduleLoad(delay){
		clearTimer();
		_logTimer=setTimeout(loadLogs, delay);
	}

	function loadLogs(){
		const body=document.getElementById('log-stream-body');
		const surface=document.getElementById('log-stream-surface');
		if(!body || !surface || surface.style.display==='none'){
			clearTimer();
			return;
		}
		const tag=document.getElementById('log-attempt-tag');
		const messageId=tag.dataset.mid||'';
		const attempt=parseInt(tag.dataset.attempt||'0',10);
		if(!messageId){ clearTimer(); return; }
		const lvl=parseInt(document.getElementById('log-level-filter').value)||0;
		const search=(document.getElementById('log-search').value||'').trim().toLowerCase();
		setPoll('fetching…');
		fetch('api/task-run-logs?message_id='+encodeURIComponent(messageId)+'&attempt='+attempt+'&limit=500&after_id='+_logAfter)
			.then(r=>r.json()).then(d=>{
				if(!document.getElementById('log-stream-body')) return;
				const logs=d.logs||[];
				let h='';
				for(const l of logs){
					if(l.kind==='progress'){
						const pct=l.total?Math.max(0,Math.min(100,l.current/l.total*100)):null;
						h+='<div class="progress-line"><span>PROGRESS</span><div><i style="width:'+(pct??0)+'%"></i></div><strong>'+(l.current??'—')+(l.total?' / '+l.total:'')+'</strong><em>'+esc(l.message||'')+'</em></div>';
						continue;
					}
					if(l.kind==='gap'){
						h+='<div class="gap-line">OBSERVATION GAP · '+esc(l.dropped||0)+' records missing</div>';
						continue;
					}
					if(l.level<lvl) continue;
					const msg=l.message||'';
					const fields=l.fields&&Object.keys(l.fields).length?' '+JSON.stringify(l.fields):'';
					const traceUrl=traceUrlTemplate&&l.fields?.trace_id ? traceUrlTemplate.replace('{trace_id}',encodeURIComponent(l.fields.trace_id)).replace('{span_id}',encodeURIComponent(l.fields.span_id||'')) : '';
					const traceLink=traceUrl?' <a class="trace-link" href="'+esc(traceUrl)+'" target="_blank" rel="noopener">trace ↗</a>':'';
					if(search&&!(msg+fields).toLowerCase().includes(search)) continue;
					h += '<div class="log-line log-lvl-'+l.level+'">'
						+'<span class="log-ts">'+ts(l.ts)+'</span>'
						+'<span class="log-lvl">'+lvlLabel(l.level)+'</span>'
						+'<span class="log-logger">'+esc(l.kind==='stdout'||l.kind==='stderr'?l.kind:(l.logger||''))+'</span>'
						+'<span class="log-msg">'+esc(msg)+'<small>'+esc(fields)+'</small>'+traceLink+'</span></div>';
				}
				if(_logAfter===0) body.innerHTML = h||'<p class="placeholder">no logs yet</p>';
				else if(h) body.innerHTML += h;
				if(d.cursor) _logAfter=d.cursor;
				body.scrollTop=body.scrollHeight;
				setPoll('live · ws');
				scheduleLoad(15000);
			}).catch(()=>{
				setPoll('error');
				scheduleLoad(5000);
			});
	}

	function setPoll(text){
		const el=document.getElementById('log-poll-indicator');
		if(el) el.textContent=text;
	}

	function lvlLabel(l){ return ({10:'DBG',20:'INF',30:'WRN',40:'ERR',50:'CRT'})[l]||String(l); }
	function ts(v){ return new Date(v).toISOString().replace('T',' ').slice(0,19); }
	function railClass(s){ return s==='succeeded'?'ok':s==='dead'||s==='failed'?'bad':s==='retried'?'retry':s==='started'?'live':'idle'; }
	function sbc(s){
		if(s==='succeeded') return 'sb-ok';
		if(s==='failed'||s==='dead') return 'sb-err';
		if(s==='retried'||s==='cancel_requested'||s==='unknown') return 'sb-retry';
		if(s==='started'||s==='running'||s==='enqueued') return 'sb-running';
		return '';
	}
	function pretty(value){ try{return JSON.stringify(value,null,2);}catch{return String(value);} }
	function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

	document.getElementById('log-level-filter').addEventListener('change',()=>{
		_logAfter=0;
		const body=document.getElementById('log-stream-body');
		if(body) body.innerHTML='';
		scheduleLoad(0);
	});
	document.getElementById('log-search').addEventListener('input',()=>{
		clearTimeout(_searchTimer);
		_searchTimer=setTimeout(()=>{
			_logAfter=0;
			const body=document.getElementById('log-stream-body');
			if(body) body.innerHTML='';
			scheduleLoad(0);
		}, 250);
	});
	window.addEventListener('kuu-envelope',event=>{
		const envelope=event.detail.envelope||{}, payload=envelope.body||{};
		if(payload.type==='log_batch'&&payload.records&&payload.records.some(r=>r.message_id===mid)) scheduleLoad(0);
		if(payload.type==='event'&&payload.message_id===mid){
			fetch('api/task-run-attempts?message_id='+encodeURIComponent(mid)).then(r=>r.json()).then(d=>d.attempts&&renderAttempts(d.attempts,d.run));
		}
	},{signal:controller.signal});
	window.addEventListener('kuu-stream-gap',()=>scheduleLoad(0),{signal:controller.signal});

	document.getElementById('log-close-btn').addEventListener('click',()=>{
		clearTimer();
		const surface=document.getElementById('log-stream-surface');
		if(surface) surface.style.display='none';
		setPoll('');
	});
})();
</script>
