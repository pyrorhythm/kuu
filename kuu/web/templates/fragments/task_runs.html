<div class="run-filters" role="search">
	<label><span>status</span><select id="tr-filter-status" aria-label="filter by status">
		<option value="">all</option>
		<option value="enqueued">enqueued</option>
		<option value="running">running</option>
		<option value="cancel_requested">cancel requested</option>
		<option value="unknown">unknown</option>
		<option value="succeeded">succeeded</option>
		<option value="failed">failed</option>
		<option value="cancelled">cancelled</option>
	</select></label>
	<label><span>task</span><input id="tr-filter-task" placeholder="task name" autocomplete="off"></label>
	<label><span>queue</span><input id="tr-filter-queue" placeholder="queue name" autocomplete="off"></label>
	<label class="filter-grow"><span>search</span><input id="tr-filter-search" placeholder="run id or error" autocomplete="off"></label>
</div>
<div class="run-table-scroll">
	<table class="kuu-table run-table" id="task-runs-table">
		<thead><tr><th>Status</th><th>Task</th><th>Queue</th><th>Attempts</th><th>Duration</th><th>Updated</th></tr></thead>
		<tbody id="task-runs-tbody"></tbody>
	</table>
</div>
<div class="table-foot" id="task-runs-foot">
	<span id="task-runs-page">loading…</span>
	<div class="pager"><button class="btn" id="tr-btn-prev" disabled>previous</button><button class="btn" id="tr-btn-next" disabled>next</button></div>
</div>

<script>
(function(){
	window.kuuRunListAbort?.abort();
	const controller=new AbortController();
	window.kuuRunListAbort=controller;
	const currentUrl=new URL(location.href);
	let offset=Math.max(0,parseInt(currentUrl.searchParams.get('offset')||'0',10)||0);
	let filterTimer,liveOnly=false;
	const liveRows=new Map();
	const visibleLiveRuns=new Set();
	const LIMIT=100;
	const status=document.getElementById('tr-filter-status');
	const task=document.getElementById('tr-filter-task');
	const queue=document.getElementById('tr-filter-queue');
	const search=document.getElementById('tr-filter-search');
	status.value=currentUrl.searchParams.get('status')||'';
	task.value=currentUrl.searchParams.get('task')||'';
	queue.value=currentUrl.searchParams.get('queue')||'';
	search.value=currentUrl.searchParams.get('search')||'';

	function syncUrl(){
		const url=new URL(location.href);
		for(const [name,value] of [['status',status.value],['task',task.value.trim()],['queue',queue.value.trim()],['search',search.value.trim()]]){
			if(value) url.searchParams.set(name,value); else url.searchParams.delete(name);
		}
		if(offset) url.searchParams.set('offset',String(offset)); else url.searchParams.delete('offset');
		history.replaceState({},'',url);
	}
	function loadRuns(){
		syncUrl();
		const params=new URLSearchParams({limit:String(LIMIT),offset:String(offset)});
		if(status.value) params.set('status',status.value);
		if(task.value.trim()) params.set('task',task.value.trim());
		if(queue.value.trim()) params.set('queue',queue.value.trim());
		if(search.value.trim()) params.set('search',search.value.trim());
		fetch('api/task-runs?'+params).then(response=>response.json()).then(data=>{
			if(!data.rows) return;
			liveOnly=Boolean(data.live_only);
			window.kuuLiveOnly=liveOnly;
			const runs=data.runs&&!liveOnly?parentRuns(data.runs):groupRuns(data.rows);
			renderRows(runs);
			document.getElementById('task-runs-page').textContent=liveOnly?'live only · history unavailable':(runs.length?`${offset+1}–${offset+runs.length}`:'no runs');
			document.getElementById('tr-btn-prev').disabled=offset===0;
			document.getElementById('tr-btn-next').disabled=runs.length<LIMIT;
		}).catch(()=>document.getElementById('task-runs-page').textContent='Run telemetry unavailable');
	}
	function parentRuns(items){
		return items.map(item=>{
			const attempts=item.attempts.length?item.attempts:[{message_id:item.message_id,attempt:0,task:item.task,queue:item.queue,status:item.status}];
			const recorded=attempts[attempts.length-1];
			return {id:item.message_id,attempts,latest:{...recorded,task:item.task,queue:item.queue,status:item.status,updated_at:item.updated_at,dead_lettered:item.dead_lettered}};
		});
	}
	function groupRuns(rows){
		const grouped=new Map();
		for(const row of rows){
			const id=row.message_id||'-';
			if(!grouped.has(id)) grouped.set(id,[]);
			grouped.get(id).push(row);
		}
		return Array.from(grouped.entries()).map(([id,attempts])=>{
			attempts.sort((a,b)=>a.attempt-b.attempt);
			return {id,attempts,latest:attempts[attempts.length-1]};
		});
	}
	function renderRows(runs){
		const tbody=document.getElementById('task-runs-tbody');
		if(!runs.length){tbody.innerHTML='<tr><td colspan="6" class="placeholder">no runs match these filters.</td></tr>';return;}
		tbody.innerHTML=runs.map(run=>{
			const item=run.latest;
			const elapsed=item.time_elapsed!=null?item.time_elapsed.toFixed(2)+'s':'—';
			const updated=item.updated_at||item.finished_at||item.started_at;
			const updatedText=updated?new Date(updated).toISOString().replace('T',' ').slice(5,19):'—';
			const dlq=item.status==='dead'||item.dead_lettered;
			const display=dlq?'failed':item.status;
			return `<tr class="task-run-row" data-mid="${esc(run.id)}" tabindex="0">
				<td><span class="status-text ${statusClass(item.status)}">${esc(display)}</span>${dlq?'<small class="state-note">DLQ</small>':''}</td>
				<td><strong>${esc(item.task)}</strong><small class="run-id">${esc(run.id)}</small></td>
				<td class="mono-cell">${esc(item.queue||'—')}</td>
				<td class="mono-cell">${run.attempts.length}</td>
				<td class="mono-cell">${elapsed}</td>
				<td class="mono-cell dim">${updatedText}</td></tr>`;
		}).join('');
		tbody.querySelectorAll('.task-run-row').forEach(row=>{
			const open=()=>{
				if(liveOnly){window.kuuToast?.('Enable persistence to inspect this Run',false);return;}
				window.kuuOpenRun(row.dataset.mid);
			};
			row.addEventListener('click',open);
			row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}});
		});
	}
	function statusClass(value){if(value==='succeeded')return 'is-good';if(value==='dead'||value==='failed')return 'is-warn';return '';}
	function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
	function filtersChanged(){clearTimeout(filterTimer);filterTimer=setTimeout(()=>{offset=0;loadRuns();},180);}
	function filteredLiveRows(){
		let rows=Array.from(liveRows.values()).filter(item=>visibleLiveRuns.has(item.message_id));
		if(status.value) rows=rows.filter(item=>item.status===status.value);
		if(task.value.trim()) rows=rows.filter(item=>(item.task||'').toLowerCase().includes(task.value.trim().toLowerCase()));
		if(queue.value.trim()) rows=rows.filter(item=>(item.queue||'').toLowerCase()===queue.value.trim().toLowerCase());
		const term=search.value.trim().toLowerCase();
		if(term) rows=rows.filter(item=>(item.message_id||'').toLowerCase().includes(term)||(item.task||'').toLowerCase().includes(term));
		return rows;
	}

	document.getElementById('tr-btn-prev').addEventListener('click',()=>{offset=Math.max(0,offset-LIMIT);loadRuns();});
	document.getElementById('tr-btn-next').addEventListener('click',()=>{offset+=LIMIT;loadRuns();});
	status.addEventListener('change',()=>{offset=0;loadRuns();});
	for(const input of [task,queue,search]) input.addEventListener('input',filtersChanged);
	window.addEventListener('kuu-envelope',event=>{
		const envelope=event.detail.envelope||{};
		const body=envelope.body;
		if(!body||body.type!=='event'||!body.message_id) return;
		if(liveOnly){
			const key=body.message_id+':'+(body.attempt||0);
			const row=liveRows.get(key)||{message_id:body.message_id,attempt:body.attempt||0,task:body.task,queue:body.queue,instance_id:envelope.instance};
			row.status=body.kind;
			row.time_elapsed=body.elapsed;
			row.updated_at=body.ts||envelope.ts;
			liveRows.set(key,row);
			if(visibleLiveRuns.has(body.message_id)) renderRows(groupRuns(filteredLiveRows()));
			return;
		}
		if(body.kind!=='enqueued'&&document.querySelector(`.task-run-row[data-mid="${CSS.escape(body.message_id)}"]`)) loadRuns();
	},{signal:controller.signal});
	window.addEventListener('kuu-apply-new-runs',()=>{
		for(const row of liveRows.values()) visibleLiveRuns.add(row.message_id);
		renderRows(groupRuns(filteredLiveRows()));
	},{signal:controller.signal});
	loadRuns();
})();
</script>
