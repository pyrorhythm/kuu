<div class="run-list-head">
	<label class="filter-search"><span>⌕</span><input id="tr-filter-task" placeholder="filter task…" autocomplete="off"></label>
	<select id="tr-filter-status" class="filter-select" aria-label="Filter status">
		<option value="">all states</option>
		<option value="enqueued">enqueued</option>
		<option value="running">running</option>
		<option value="cancel_requested">cancel requested</option>
		<option value="unknown">unknown</option>
		<option value="succeeded">succeeded</option>
		<option value="failed">failed</option>
		<option value="cancelled">cancelled</option>
	</select>
</div>
<div class="run-table-scroll">
	<table class="kuu-table run-table" id="task-runs-table">
		<thead><tr><th>task / run</th><th>attempt telemetry</th><th>state</th><th>elapsed</th><th>finished</th></tr></thead>
		<tbody id="task-runs-tbody"></tbody>
	</table>
</div>
<div class="tasks-foot" id="task-runs-foot">
	<div class="tasks-page-info" id="task-runs-page">acquiring…</div>
	<div class="pager"><button class="btn" id="tr-btn-prev" disabled>←</button><button class="btn" id="tr-btn-next" disabled>→</button></div>
</div>

<script>
(function(){
	window.kuuRunListAbort?.abort();
	const controller=new AbortController();
	window.kuuRunListAbort=controller;
	let offset=0, filterTimer, liveOnly=false;
	const liveRows=new Map();
	const visibleLiveRuns=new Set();
	const LIMIT=100;
	const status=document.getElementById('tr-filter-status');
	const task=document.getElementById('tr-filter-task');

	function loadRuns(){
		const params=new URLSearchParams({limit:LIMIT,offset});
		if(status.value) params.set('status',status.value);
		if(task.value.trim()) params.set('task',task.value.trim());
		fetch('api/task-runs?'+params).then(r=>r.json()).then(d=>{
			if(!d.rows) return;
			liveOnly=Boolean(d.live_only);
			window.kuuLiveOnly=liveOnly;
			const runs=d.runs&&!liveOnly ? parentRuns(d.runs) : groupRuns(d.rows);
			renderRows(runs);
			document.getElementById('task-runs-page').textContent=liveOnly ? 'LIVE-ONLY · no retained history' : (runs.length ? `${offset+1}–${offset+runs.length}` : 'no Runs');
			document.getElementById('tr-btn-prev').disabled=offset===0;
			document.getElementById('tr-btn-next').disabled=runs.length<LIMIT;
		}).catch(()=>document.getElementById('task-runs-page').textContent='telemetry unavailable');
	}
	function parentRuns(items){
		return items.map(item=>{
			const attempts=item.attempts.length?item.attempts:[{message_id:item.message_id,attempt:0,task:item.task,status:item.status}];
			const recorded=attempts[attempts.length-1];
			return {
				id:item.message_id,
				attempts,
				latest:{...recorded,task:item.task,status:item.status,instance_id:item.instance_id,dead_lettered:item.dead_lettered,finished_at:['succeeded','failed','cancelled'].includes(item.status)?item.updated_at:null},
			};
		});
	}
	function groupRuns(rows){
		const grouped=new Map();
		for(const row of rows){
			const id=row.message_id||'-';
			if(!grouped.has(id)) grouped.set(id,[]);
			grouped.get(id).push(row);
		}
		return Array.from(grouped.entries()).map(([id,attempts])=>{
			attempts.sort((a,b)=>a.attempt-b.attempt);
			return {id,attempts,latest:attempts[attempts.length-1]};
		});
	}
	function renderRows(runs){
		const tbody=document.getElementById('task-runs-tbody');
		if(!runs.length){ tbody.innerHTML='<tr><td colspan="5" class="placeholder">No Runs match this view.</td></tr>'; return; }
		const selected=new URL(location.href).searchParams.get('run');
		tbody.innerHTML=runs.map(run=>{
			const r=run.latest;
			const short=run.id.length>10?run.id.slice(0,10)+'…':run.id;
			const elapsed=r.time_elapsed!=null?r.time_elapsed.toFixed(2)+'s':'—';
			const finished=r.finished_at?new Date(r.finished_at).toISOString().replace('T',' ').slice(5,19):'live';
			const dlq=r.status==='dead'||r.dead_lettered;
			const display=dlq?'failed':r.status;
			const rail=run.attempts.map((a,i)=>`<i class="rail-node ${stateClass(a.status)}" title="Attempt ${i+1}: ${esc(a.status)}"><b>${i+1}</b></i>`).join('<span></span>');
			return `<tr class="task-run-row ${selected===run.id?'selected':''}" data-mid="${esc(run.id)}">
				<td><strong>${esc(r.task)}</strong><small class="mono">${esc(short)}</small></td>
				<td><div class="attempt-rail">${rail}</div></td>
				<td><span class="status-badge ${badge(r.status)}">${esc(display)}</span>${dlq?'<em class="dlq-chip">DLQ</em>':''}</td>
				<td class="mono-cell">${elapsed}</td><td class="mono-cell dim">${finished}</td></tr>`;
		}).join('');
		tbody.querySelectorAll('.task-run-row').forEach(row=>row.addEventListener('click',()=>{
			if(liveOnly){ document.getElementById('run-detail-pane').innerHTML='<div class="run-empty"><strong>Live-only Run</strong><span>Enable persistence for Attempts, logs, failures, Retry, and Replay.</span></div>'; return; }
			window.kuuOpenRun(row.dataset.mid);
		}));
	}
	function badge(value){ if(value==='succeeded')return 'sb-ok'; if(value==='dead'||value==='failed')return 'sb-err'; if(value==='retried'||value==='unknown'||value==='lost'||value==='cancel_requested')return 'sb-retry'; if(value==='started'||value==='running'||value==='enqueued')return 'sb-running'; return ''; }
	function stateClass(value){ return value==='succeeded'?'ok':value==='dead'||value==='failed'?'bad':value==='retried'||value==='unknown'||value==='lost'?'retry':value==='started'?'live':'idle'; }
	function esc(value){ return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

	document.getElementById('tr-btn-prev').addEventListener('click',()=>{offset=Math.max(0,offset-LIMIT);loadRuns();});
	document.getElementById('tr-btn-next').addEventListener('click',()=>{offset+=LIMIT;loadRuns();});
	status.addEventListener('change',()=>{offset=0;loadRuns();});
	task.addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(()=>{offset=0;loadRuns();},180);});
	window.addEventListener('kuu-envelope',event=>{
		const envelope=event.detail.envelope||{};
		const body=envelope.body;
		if(!body||body.type!=='event'||!body.message_id) return;
		if(liveOnly){
			const key=body.message_id+':'+(body.attempt||0);
			const row=liveRows.get(key)||{message_id:body.message_id,attempt:body.attempt||0,task:body.task,instance_id:envelope.instance};
			row.status=body.kind;
			row.time_elapsed=body.elapsed;
			if(body.kind==='started'&&!row.started_at) row.started_at=body.ts||envelope.ts;
			if(['succeeded','dead','cancelled'].includes(body.kind)) row.finished_at=body.ts||envelope.ts;
			liveRows.set(key,row);
			if(!visibleLiveRuns.has(body.message_id)) return;
			let rows=Array.from(liveRows.values()).filter(item=>visibleLiveRuns.has(item.message_id));
			if(status.value) rows=rows.filter(item=>item.status===status.value);
			if(task.value.trim()) rows=rows.filter(item=>item.task.includes(task.value.trim()));
			renderRows(groupRuns(rows));
			return;
		}
		if(body.kind!=='enqueued'){
			const row=document.querySelector(`.task-run-row[data-mid="${CSS.escape(body.message_id)}"]`);
			if(row) loadRuns();
		}
	},{signal:controller.signal});
	window.addEventListener('kuu-apply-new-runs',()=>{
		for(const row of liveRows.values()) visibleLiveRuns.add(row.message_id);
		let rows=Array.from(liveRows.values());
		if(status.value) rows=rows.filter(item=>item.status===status.value);
		if(task.value.trim()) rows=rows.filter(item=>item.task.includes(task.value.trim()));
		renderRows(groupRuns(rows));
	},{signal:controller.signal});
	loadRuns();
})();
</script>
